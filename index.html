<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NekretnineXpert — 3D objekat</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0b0d10;color:#fff;font-family:Inter,system-ui,Arial}#ui{position:fixed;z-index:5;top:18px;left:18px;width:310px;background:rgba(12,15,19,.88);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;box-shadow:0 14px 40px rgba(0,0,0,.35)}h1{font-size:16px;margin:0 0 2px;font-weight:650}.sub{font-size:12px;color:#aeb6c2;margin-bottom:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}button{border:1px solid #313842;background:#171b21;color:#e7ebf0;border-radius:10px;padding:9px 8px;cursor:pointer;font-size:12px}button:hover,button.active{background:#232a33;border-color:#8993a3}.full{width:100%;margin-bottom:8px}.meta{display:grid;grid-template-columns:1fr auto;gap:5px 10px;margin-top:11px;font-size:11px;color:#b9c1cb}.meta strong{color:#fff;font-weight:600}.hint{font-size:10px;color:#828b97;line-height:1.45;margin-top:12px}.progress{height:4px;background:#20252c;border-radius:99px;overflow:hidden;margin:12px 0 4px}.bar{height:100%;width:0;background:#d6b36a}.status{font-size:10px;color:#aab2bd}#label{position:fixed;z-index:4;right:18px;bottom:18px;padding:8px 11px;background:rgba(12,15,19,.72);border:1px solid rgba(255,255,255,.12);border-radius:10px;font-size:11px;color:#c6cdd6}canvas{display:block}</style></head><body>
<div id="ui"><h1>NekretnineXpert 3D</h1><div class="sub">E-26154 · Jovana Popovića 63A, Novi Sad</div><div class="row"><button onclick="showAll()">SVE</button><button onclick="showPrefix('SOUTERRAIN')">SUTEREN</button></div><div class="row"><button onclick="showPrefix('GROUND_FLOOR')">PRIZEMLJE</button><button onclick="showPrefix('FLOOR_1')">1. SPRAT</button></div><div class="row"><button onclick="showPrefix('FLOOR_2')">2. SPRAT</button><button onclick="showPrefix('FLOOR_3')">3. SPRAT</button></div><button class="full" onclick="showPrefix('ROOF')">KROV</button><button class="full" onclick="explode()">EKSPLODIRANI PRIKAZ</button><div class="row"><button onclick="resetView()">RESET POGLEDA</button><button onclick="toggleGround()">TEREN</button></div><div class="meta"><span>Stanova</span><strong>15</strong><span>Garažnih mesta</span><strong>15</strong><span>BRGP</span><strong>1.410,11 m²</strong><span>Spratnost</span><strong>Su+P+3</strong></div><div class="progress"><div class="bar" id="bar"></div></div><div class="status" id="status">Učitavanje 3D modela…</div><div class="hint">Levi klik + prevlačenje: rotacija · Točkić: zoom · Desni klik + prevlačenje: pomeranje · Model je baziran na arhitektonskom projektu E-26154.</div></div><div id="label"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b0d10);scene.fog=new THREE.Fog(0x0b0d10,40,95);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.05,300);camera.position.set(24,-24,18);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.055;controls.minDistance=7;controls.maxDistance=65;controls.target.set(7,7,5);
scene.add(new THREE.HemisphereLight(0xdfe7f2,0x2a241d,2.0));const sun=new THREE.DirectionalLight(0xfff2dc,3.2);sun.position.set(-18,-14,34);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-25;sun.shadow.camera.right=25;sun.shadow.camera.top=25;sun.shadow.camera.bottom=-25;scene.add(sun);
let root=null, groundVisible=true, exploded=false, originalPos=new Map();
function fit(){if(!root)return;const b=new THREE.Box3().setFromObject(root);const s=b.getSize(new THREE.Vector3()).length();const c=b.getCenter(new THREE.Vector3());controls.target.copy(c);camera.position.copy(c).add(new THREE.Vector3(s*.55,-s*.65,s*.42));controls.maxDistance=s*2.3;controls.update()}
function allNodes(){const arr=[];root.traverse(o=>{if(o.isMesh)arr.push(o)});return arr}
function showAll(){allNodes().forEach(o=>o.visible=true);setLabel('Sve etaže')}
window.showAll=showAll;
function showPrefix(prefix){allNodes().forEach(o=>{const n=o.name||'';o.visible=n.includes(prefix)||n.includes('ROOF')&&prefix==='ROOF'});setLabel(prefix.replace('_',' '))}
window.showPrefix=showPrefix;
function setLabel(t){document.getElementById('label').textContent=t}
function explode(){exploded=!exploded;const groups={SOUTERRAIN:-3.9,GROUND_FLOOR:0,FLOOR_1:3.3,FLOOR_2:6.6,FLOOR_3:9.9,ROOF:13.2};root.traverse(o=>{if(!o.isObject3D||!o.name)return; if(!originalPos.has(o))originalPos.set(o,o.position.clone()); let k=Object.keys(groups).find(g=>o.name.includes(g)); if(k){o.position.z=originalPos.get(o).z+(exploded?groups[k]*.22:0)}});setLabel(exploded?'Eksplodirani prikaz':'Normalan prikaz')}
window.explode=explode;
function resetView(){fit();setLabel('Pogled resetovan')};window.resetView=resetView;
function toggleGround(){groundVisible=!groundVisible;const g=root?.getObjectByName('SITE_GROUND');if(g)g.visible=groundVisible;const st=root?.getObjectByName('STREET');if(st)st.visible=groundVisible;const sw=root?.getObjectByName('SIDEWALK');if(sw)sw.visible=groundVisible;setLabel(groundVisible?'Teren uključen':'Teren isključen')}window.toggleGround=toggleGround;
const loader=new GLTFLoader();loader.load('./building_nekretninexpert_premium.glb',g=>{root=g.scene;scene.add(root);root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=true;originalPos.set(o,o.position.clone())}});fit();document.getElementById('status').textContent='Model spreman';document.getElementById('bar').style.width='100%';setLabel('360° 3D pregled');},xhr=>{if(xhr.total){const p=xhr.loaded/xhr.total*100;document.getElementById('bar').style.width=p.toFixed(1)+'%';document.getElementById('status').textContent=`Učitavanje ${p.toFixed(0)}%`}},e=>{console.error(e);document.getElementById('status').textContent='Greška pri učitavanju GLB modela';setLabel('GLB nije pronađen')});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
(function anim(){requestAnimationFrame(anim);controls.update();renderer.render(scene,camera)})();
</script></body></html>
